<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>if (window.parent === window) location.replace('../#rocket');</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroBox 로켓 발사 탐구</title>
<style>
  :root { --panel: rgba(8, 12, 20, 0.72); --line: rgba(255,255,255,0.12); --fg: #e8eef7; --dim: #8fa0b8; --acc: #ffb347; --ok: #6ee7a8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--fg); font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  .panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #hud { left: 16px; top: 16px; padding: 12px 14px; min-width: 236px; font-variant-numeric: tabular-nums; }
  #hud .row { display: flex; justify-content: space-between; align-items: baseline; padding: 3px 0; gap: 16px; }
  #hud .row.sub { padding-top: 6px; margin-top: 4px; border-top: 1px solid var(--line); }
  #hud .k { color: var(--dim); font-size: 12px; letter-spacing: 0.02em; }
  #hud .v { font-size: 17px; font-weight: 600; }
  #hud .row.small .v { font-size: 13px; font-weight: 500; color: #c8d3e3; }
  #tplus { font-size: 26px; font-weight: 700; letter-spacing: 0.02em; }
  #fuelbar { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.12); margin-top: 4px; overflow: hidden; }
  #fuelbar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff7a45, #ffb347); transition: width 0.15s linear; }
  #phase { left: 50%; top: 16px; transform: translateX(-50%); padding: 8px 18px; font-size: 15px; font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; }
  #phase b { color: var(--acc); }
  #toasts { position: absolute; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .toast { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--acc); border-radius: 10px; padding: 10px 14px; font-size: 14px; min-width: 200px; animation: toastin 0.25s ease-out; backdrop-filter: blur(10px); }
  .toast .t { color: var(--dim); font-size: 11px; margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  .toast.out { animation: toastout 0.4s ease-in forwards; }
  @keyframes toastin { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  @keyframes toastout { to { opacity: 0; transform: translateX(16px); } }
  #controls { left: 50%; bottom: 18px; transform: translateX(-50%); padding: 10px 12px; display: flex; gap: 14px; align-items: center; pointer-events: auto; flex-wrap: wrap; justify-content: center; }
  .group { display: flex; gap: 4px; align-items: center; }
  .group .lbl { color: var(--dim); font-size: 11px; margin-right: 4px; }
  button { appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,0.06); color: var(--fg); font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
  button:hover { background: rgba(255,255,255,0.12); }
  button.on { background: rgba(255,179,71,0.18); border-color: var(--acc); color: #ffd79a; }
  button.primary { background: #ff7a45; border-color: #ff7a45; color: #fff; font-weight: 700; padding: 8px 18px; }
  button.primary:hover { background: #ff8f60; }
  button.primary:disabled { opacity: 0.45; cursor: default; }
  #hint { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); color: var(--dim); font-size: 12px; white-space: nowrap; }
  #countdown { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font-size: 96px; font-weight: 800; color: #fff; text-shadow: 0 0 30px rgba(255,150,60,0.8); opacity: 0; transition: opacity 0.2s; font-variant-numeric: tabular-nums; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; color: var(--dim); font-size: 14px; z-index: 10; transition: opacity 0.4s; }
  @media (max-width: 640px) { #hud { min-width: 190px; padding: 8px 10px; } #hud .v { font-size: 14px; } #tplus { font-size: 20px; } #phase { font-size: 12px; padding: 6px 12px; } #hint { display: none; } }
  #btnDetails { display: none; pointer-events: auto; }
  @media (max-width: 640px) {
    #hud { left: 8px; top: 44px; min-width: 160px; max-width: 210px; }
    #hud .row.small, #hud .row:nth-of-type(n+5), #fuelbar { display: none; }
    #hud.expanded .row, #hud.expanded #fuelbar { display: flex; }
    #btnDetails { display: block; font-size: 11px; padding: 4px 6px; margin-bottom: 4px; }
    #phase { top: 8px; }
    #controls { bottom: 8px; width: calc(100% - 16px); gap: 6px; padding: 8px; }
    #controls button { font-size: 11px; padding: 6px 8px; }
    #toasts { top: auto; bottom: 160px; right: 8px; max-width: calc(100% - 16px); }
    .toast { font-size: 12px; min-width: 0; }
  }
</style>
</head>
<body>
<div id="ui">
  <div class="panel" id="hud">
    <button id="btnDetails" aria-expanded="false">비행 정보 펼치기</button><div class="row"><span class="k">경과 시간</span><span class="v" id="tplus">T−00:00</span></div>
    <div class="row"><span class="k">현재 단계</span><span class="v" id="phaseTxt">발사 대기</span></div>
    <div class="row sub"><span class="k">고도</span><span class="v" id="alt">0.00 km</span></div>
    <div class="row"><span class="k">속도</span><span class="v" id="spd">0 km/h</span></div>
    <div class="row"><span class="k">마하</span><span class="v" id="mach">0.00</span></div>
    <div class="row"><span class="k" id="fuelK">남은 연료 (1단)</span><span class="v" id="fuel">100.0%</span></div>
    <div id="fuelbar"><i id="fuelI"></i></div>
    <div class="row sub small"><span class="k">피치각 / 비행경로각</span><span class="v" id="gamma">90° / 90°</span></div>
    <div class="row small"><span class="k">다운레인지</span><span class="v" id="range">0 km</span></div>
    <div class="row small"><span class="k">근지점 / 원지점</span><span class="v" id="apsis">— / —</span></div>
    <div class="row small"><span class="k">가속도</span><span class="v" id="gee">1.0 G</span></div>
    <div class="row small"><span class="k">총 질량 / 추력</span><span class="v" id="mass">— / —</span></div>
    <div class="row small"><span class="k">동압 (Q)</span><span class="v" id="q">0 kPa</span></div>
  </div>
  <div class="panel" id="phase">단계 <b id="phaseBig">발사 대기</b></div>
  <div id="toasts"></div>
  <div id="countdown"></div>
  <div id="hint">드래그: 회전 · 휠: 줌 (자유 카메라) · 1~3: 배속 · C: 카메라 · 스페이스: 발사 · R: 리셋</div>
  <div class="panel" id="controls">
    <div class="group">
      <button class="primary" id="btnLaunch" disabled>먼저 예측해요</button>
      <button id="btnReset">리셋</button>
    </div>
    <div class="group"><span class="lbl">배속</span>
      <button data-speed="1" class="on">1×</button><button data-speed="10">10×</button><button data-speed="100">100×</button>
    </div>
    <div class="group"><span class="lbl">카메라</span>
      <button data-cam="cine" class="on">로켓 추적 (시네마틱)</button><button data-cam="free">자유 회전</button>
    </div>
    <div class="group"><button id="btnSound">🔊 사운드</button></div>
  </div>
  <div id="loading">지구·로켓 텍스처 생성 중…</div>
</div>

<script>window.addEventListener('error', e => { const l = document.getElementById('loading'); if (l) l.textContent = '오류: ' + e.message; });</script>

/* ============================================================

function hashNoise(seed) {
  const perm = new Uint8Array(512); const p = []; for (let i = 0; i < 256; i++) p[i] = i;
  let s = seed; for (let i = 255; i > 0; i--) { s = (s * 16807) % 2147483647; const j = s % (i + 1); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const grad = (h, x, y) => { switch (h & 3) { case 0: return x + y; case 1: return -x + y; case 2: return x - y; default: return -x - y; } };
  return (x, y) => {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255; x -= Math.floor(x); y -= Math.floor(y);
    const u = fade(x), v = fade(y), A = perm[X] + Y, B = perm[X + 1] + Y;
    const l1 = grad(perm[A], x, y) + u * (grad(perm[B], x - 1, y) - grad(perm[A], x, y));
    const l2 = grad(perm[A + 1], x, y - 1) + u * (grad(perm[B + 1], x - 1, y - 1) - grad(perm[A + 1], x, y - 1));
    return l1 + v * (l2 - l1);
  };
}
function fbm(noise, x, y, oct = 5, lac = 2.0, gain = 0.5) { let a = 1, f = 1, s = 0, n = 0; for (let i = 0; i < oct; i++) { s += a * noise(x * f, y * f); n += a; a *= gain; f *= lac; } return s / n; }

function decodeLandMask() {
  const bin = atob(LAND_B64), W = 1024, H = 512, m = new Uint8Array(W * H);
  let i = 0, pos = 0, v = 0;
  while (i < bin.length) { let r = 0, sh = 0, b; do { b = bin.charCodeAt(i++); r |= (b & 127) << sh; sh += 7; } while (b & 128); if (v) m.fill(1, pos, pos + r); pos += r; v ^= 1; }
  // 해안 거리(연안 색·해안선 부드럽게): 박스 블러 3회
  let f = new Float32Array(m), g = new Float32Array(W * H);
  for (let pass = 0; pass < 3; pass++) {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { let s = 0; for (let dx = -2; dx <= 2; dx++) s += f[y * W + ((x + dx + W) % W)]; g[y * W + x] = s / 5; }
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { let s = 0, n = 0; for (let dy = -2; dy <= 2; dy++) { const yy = y + dy; if (yy >= 0 && yy < H) { s += g[yy * W + x]; n++; } } f[y * W + x] = s / n; }
  }
  return { mask: m, soft: f, W, H };
}

function makeSiteRotation() {

  const z = [0, 0, 1]; let ax = [z[1] * p0[2] - z[2] * p0[1], z[2] * p0[0] - z[0] * p0[2], z[0] * p0[1] - z[1] * p0[0]];

  const rp = sim.stats.rp, ra = sim.stats.ra; dom.apsis.textContent = (Number.isNaN(rp) || rp < -C.R * 0.9 ? '—' : (rp / 1000).toFixed(0) + ' km') + ' / ' + (Number.isNaN(ra) ? '—' : (ra / 1000).toFixed(0) + ' km');
  dom.gee.textContent = (sim.phase === 'PRELAUNCH' || sim.t < 0 ? 1 : sim.accel / C.g0).toFixed(1) + ' G';
  dom.mass.textContent = (sim.mass / 1000).toFixed(1) + ' t / ' + (sim.thrust / 1e6).toFixed(1) + ' MN';
  dom.q.textContent = (sim.q / 1000).toFixed(1) + ' kPa';
  if (sim.phase === 'COUNTDOWN' || sim.phase === 'IGNITION') { dom.countdown.style.opacity = 1; dom.countdown.textContent = Math.ceil(-sim.t); } else dom.countdown.style.opacity = 0;

  renderer.render(scene, camera);
}
// 같은 출처의 AstroBox 화면만 시뮬레이션을 제어해요.
let armed = false, reported = false;
function send(type, data = {}) { if (window.parent !== window) window.parent.postMessage({ channel: 'astrobox-rocket', type, ...data }, location.origin); }
window.addEventListener('message', e => {
  if (e.origin !== location.origin || e.source !== window.parent || e.data?.channel !== 'astrobox-rocket') return;
  if (e.data.type === 'reset') { doReset(); return; }
  if (e.data.type === 'arm' && sim.phase === 'PRELAUNCH') {
    const fuel = Number(e.data.fuel); if (!Number.isFinite(fuel) || fuel < 20 || fuel > 100) return;
    sim.fuelScale = fuel / 100; sim.reset(); armed = true; $('btnLaunch').disabled = false; $('btnLaunch').textContent = '🚀 발사';
  }
  if (e.data.type === 'launch') doLaunch();
});
window.addEventListener('pagehide', () => { sfx.ctx?.close().catch(() => {}); renderer.dispose(); });
send('ready');
window.__app = { sim, scene, camera, cam, state, fireP, smokeP };
$('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 500);
requestAnimationFrame(t => { state.last = t; frame(t); });
</script>
